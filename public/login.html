<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CEASA CONECTA</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1A6B35">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('secop_tema')||'light');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #f5f2ec;
    }

    .login-page { display: flex; min-height: 100vh; }

    /* ── Painel esquerdo: institucional ─────────────────────────────────── */
    .login-hero {
      flex: 0 0 42%;
      background: #1A6B35;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px 48px;
    }
    .login-hero h1 {
      font-size: clamp(26px, 3vw, 34px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -.3px;
      max-width: 460px;
    }
    .login-hero p {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255,255,255,.82);
      margin-top: 18px;
      max-width: 420px;
    }
    .login-hero-footer {
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,.22);
      font-size: 12.5px;
      letter-spacing: .3px;
      color: rgba(255,255,255,.65);
    }

    /* ── Painel direito: formulário ──────────────────────────────────────── */
    .login-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: #f9f8f5;
    }
    /* Losango da CEASAMINAS como marca d'água — mesmo SVG inline já usado como
       fallback da logo mais abaixo (.logo-diamond), sem carregar imagem nova. */
    .login-panel-watermark {
      position: absolute;
      top: 50%; left: 50%;
      width: 460px; height: 460px;
      transform: translate(-50%, -50%);
      opacity: .05;
      z-index: 0;
      pointer-events: none;
    }
    .login-panel-inner { position: relative; z-index: 1; width: 100%; max-width: 360px; }

    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo-img { max-width: 190px; height: auto; }
    .logo-diamond { display: inline-block; }

    .login-panel-inner h2 {
      font-size: 19px;
      font-weight: 700;
      color: #1a2035;
      margin-bottom: 4px;
    }
    .login-panel-inner > p {
      font-size: 13px;
      color: #888;
      margin-bottom: 22px;
    }
    .login-security-note {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #999;
      margin-top: 22px;
    }
    .login-security-note svg { flex-shrink: 0; opacity: .7; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #e0e4ea;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      outline: none;
      transition: border-color .15s;
    }
    .form-group input:focus { border-color: #1A6B35; }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #1A6B35;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background .15s;
    }
    .btn-login:hover { background: #155929; }
    .btn-login:disabled { background: #aaa; cursor: not-allowed; }
    .error-msg {
      display: none;
      background: #FFEBEE;
      border: 1px solid #EF9A9A;
      color: #C62828;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* ── Tema escuro (só o painel direito muda — o verde é cor de marca) ─── */
    [data-theme="dark"] .login-panel { background: #0d1117; }
    [data-theme="dark"] .login-panel-inner h2 { color: #e6edf3; }
    [data-theme="dark"] .login-panel-inner > p { color: #8b949e; }
    [data-theme="dark"] .form-group label { color: #8b949e; }
    [data-theme="dark"] .form-group input {
      background: #161b22;
      border-color: #30363d;
      color: #e6edf3;
    }
    [data-theme="dark"] .form-group input:focus { border-color: #2ea043; }
    [data-theme="dark"] .login-security-note { color: #6e7681; }
    /* A logo é um PNG com texto escuro, feito pra fundo claro — sem uma
       "plaquinha" clara por trás (elemento à parte, pra continuar centralizada
       pelo text-align do wrapper), o texto do arquivo some no fundo escuro. */
    [data-theme="dark"] .login-logo-plate {
      display: inline-block;
      background: #f4f2ec;
      padding: 18px 26px;
      border-radius: 12px;
    }

    /* ── Empilha em telas estreitas ───────────────────────────────────────── */
    @media (max-width: 860px) {
      .login-page { flex-direction: column; }
      .login-hero { flex: none; padding: 36px 28px; }
      .login-panel { padding: 28px; }
    }
  </style>
</head>
<body>
<div class="login-page">

  <div class="login-hero">
    <div>
      <h1>CEASA CONECTA</h1>
      <p>Decisões registradas. Processos rastreados. Nada se perde.</p>
    </div>
    <div class="login-hero-footer" id="login-hero-footer">CEASAMINAS</div>
  </div>

  <div class="login-panel">
    <svg class="login-panel-watermark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" aria-hidden="true" focusable="false">
      <polygon points="28,2 2,28 28,28" fill="#1A6B35"/>
      <polygon points="28,2 54,28 28,28" fill="#F9A800"/>
      <polygon points="54,28 28,54 28,28" fill="#1A6B35"/>
      <polygon points="2,28 28,54 28,28" fill="#1A6B35"/>
    </svg>
    <div class="login-panel-inner">
      <div class="login-logo">
        <span class="login-logo-plate">
          <img src="img/Logo_1_transp.png" alt="CEASAMINAS" class="login-logo-img"
            onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
          <div class="logo-diamond" style="display:none;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="64" height="64">
              <polygon points="28,2 2,28 28,28" fill="#1A6B35"/>
              <polygon points="28,2 54,28 28,28" fill="#F9A800"/>
              <polygon points="54,28 28,54 28,28" fill="#1A6B35"/>
              <polygon points="2,28 28,54 28,28" fill="#1A6B35"/>
            </svg>
          </div>
        </span>
      </div>

      <h2>Acessar minha conta</h2>
      <p>Informe seu usuário e senha institucionais para continuar.</p>

      <div class="error-msg" id="error-msg"></div>

      <form id="login-form" onsubmit="fazerLogin(event)">
        <div class="form-group">
          <label>Usuário</label>
          <input type="text" id="username" autocomplete="username" placeholder="Digite seu usuário" required />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button class="btn-login" type="submit" id="btn-login">Entrar</button>
      </form>

      <div class="login-security-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Acesso restrito a usuários autorizados pela CEASAMINAS.
      </div>
    </div>
  </div>

</div>

<script src="js/pwa.js"></script>
<script>
// Rodapé do painel esquerdo — mesmo padrão de fetch já usado pra injetar a
// versão no rodapé global (auth.js:_injetarRodape) e na sidebar, só que sem
// incluir auth.js inteiro aqui (login.html não roda a lógica de sessão dele
// de propósito). Falha silenciosa: sem versão, fica só "CEASAMINAS · ano".
(async () => {
  const el = document.getElementById('login-hero-footer');
  const ano = new Date().getFullYear();
  el.textContent = `CEASAMINAS · ${ano}`;
  try {
    const r = await fetch('/api/version');
    if (r.ok) { const { version } = await r.json(); el.textContent = `CEASAMINAS · ${ano} · v${version}`; }
  } catch {}
})();

async function fazerLogin(e) {
  e.preventDefault();
  const btn  = document.getElementById('btn-login');
  const err  = document.getElementById('error-msg');
  btn.disabled   = true;
  btn.textContent = 'Entrando...';
  err.style.display = 'none';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        senha:    document.getElementById('senha').value
      })
    });
    if (!res.ok) {
      const data = await res.json();
      err.textContent = data.error || 'Erro ao fazer login';
      err.style.display = 'block';
      return;
    }
    const data = await res.json();
    // Senha provisória (1º acesso / senha redefinida): obriga a trocar antes de
    // entrar. Depois: vários módulos (ou master) escolhem; um só vai direto pra
    // home. O bloqueio (sem módulo) já cai no ramo !res.ok acima.
    window.location.replace(
      data.trocar_senha ? '/trocar-senha.html'
      : (data.escolher ? '/selecionar-modulo.html' : (data.home || '/index.html'))
    );
  } catch {
    err.textContent = 'Erro de conexão com o servidor';
    err.style.display = 'block';
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
