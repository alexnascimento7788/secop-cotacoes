<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escolha o módulo — CEASA CONECTA</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1A6B35">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('secop_tema')||'light');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #f0f4f1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap { width: 100%; max-width: 520px; padding: 16px; }
    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 22px; font-weight: 800; color: #1A6B35; }
    .header p { font-size: 12px; font-weight: 600; color: #8A9690; margin-top: 3px; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 30px 26px;
      box-shadow: 0 1px 2px rgba(20,36,26,.05), 0 20px 44px -18px rgba(20,36,26,.20);
    }
    .card h2 { font-size: 21px; font-weight: 800; color: #16241B; margin-bottom: 5px; }
    .card p.sub { font-size: 13px; color: #6B776E; margin-bottom: 22px; }

    /* Passo 1: grid de departamentos — o Departamento é o protagonista desta
       tela (pedido explícito do Alex, 2026-09-18): o Módulo só aparece
       depois, no Passo 2, escopado a 1 departamento por vez. Escala bem
       pra qualquer quantidade de módulos porque nunca lista todos de uma
       vez — só os do departamento escolhido. */
    .dept-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .dept-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
      padding: 18px 16px; border: 1.5px solid #E4E9E4; border-radius: 12px;
      background: #fff; cursor: pointer; text-align: left; width: 100%;
      font: inherit; transition: box-shadow .15s;
    }
    .dept-card:hover { box-shadow: 0 3px 14px rgba(0,0,0,.08); }
    .dept-card:active { transform: translateY(1px); }
    .dept-icone {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--dept-cor, #1A6B35);
    }
    .dept-nome { font-size: 17px; font-weight: 800; color: #16241B; }
    .dept-count { font-size: 11.5px; color: #8A9690; margin-top: -6px; }

    /* Passo 2: módulos do departamento escolhido (Seção como subgrupo, só
       quando existir de verdade — nem todo departamento tem uma). */
    .voltar-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12.5px; font-weight: 700; color: #6B776E;
      background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 18px;
      font-family: inherit;
    }
    .passo2-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .passo2-icone {
      width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--dept-cor, #1A6B35);
    }
    .passo2-nome { font-size: 19px; font-weight: 800; color: #16241B; }
    .secao-titulo {
      font-size: 11px; font-weight: 700; color: #8A9690; text-transform: uppercase;
      margin: 16px 0 8px;
    }
    .secao-titulo:first-child { margin-top: 0; }
    .mod-item {
      display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
      padding: 14px 16px; border: 1.5px solid #E4E9E4; border-radius: 11px;
      background: #fff; cursor: pointer; margin-bottom: 10px; font: inherit;
      transition: box-shadow .15s, transform .05s;
    }
    .mod-item:last-child { margin-bottom: 0; }
    .mod-item:hover { box-shadow: 0 3px 14px rgba(0,0,0,.08); }
    .mod-item:active { transform: translateY(1px); }
    .mod-badge {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--mod-cor, #1A6B35); color: var(--mod-texto, #fff);
      font-weight: 800; font-size: 16px;
    }
    .mod-info { flex: 1; min-width: 0; }
    .mod-nome { display: block; font-size: 15px; font-weight: 700; color: #16241B; }
    .mod-desc { display: block; font-size: 12px; color: #6B776E; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mod-arrow { margin-left: auto; color: #B7C0BA; flex-shrink: 0; }

    .error-msg {
      display: none;
      background: #FFEBEE; border: 1px solid #EF9A9A; color: #C62828;
      border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px;
    }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; }
    .footer a { color: #8A9690; text-decoration: underline; cursor: pointer; }

    [data-theme="dark"] body { background: #0d1117; }
    [data-theme="dark"] .header h1 { color: #58a6ff; }
    [data-theme="dark"] .header p  { color: #8b949e; }
    [data-theme="dark"] .card { background: #161b22; box-shadow: 0 20px 44px -18px rgba(0,0,0,.5); }
    [data-theme="dark"] .card h2 { color: #e6edf3; }
    [data-theme="dark"] .card p.sub { color: #8b949e; }
    [data-theme="dark"] .dept-card, [data-theme="dark"] .mod-item { background: #0d1117; border-color: #30363d; }
    [data-theme="dark"] .dept-nome, [data-theme="dark"] .passo2-nome, [data-theme="dark"] .mod-nome { color: #e6edf3; }
    [data-theme="dark"] .dept-count, [data-theme="dark"] .mod-desc, [data-theme="dark"] .secao-titulo, [data-theme="dark"] .voltar-btn { color: #8b949e; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>CEASA CONECTA</h1>
    <p>CEASAMINAS</p>
  </div>
  <div class="card">
    <div class="error-msg" id="error-msg"></div>

    <div id="passo-departamentos">
      <h2>Escolha o Departamento</h2>
      <p class="sub">Selecione onde você vai trabalhar.</p>
      <div class="dept-grid" id="dept-grid">
        <div style="grid-column:1/-1;text-align:center;color:#aaa;padding:20px;font-size:13px;">Carregando...</div>
      </div>
    </div>

    <div id="passo-modulos" style="display:none;">
      <button class="voltar-btn" onclick="voltarParaDepartamentos()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
        Departamentos
      </button>
      <div class="passo2-header">
        <span class="passo2-icone" id="passo2-icone"></span>
        <span class="passo2-nome" id="passo2-nome"></span>
      </div>
      <div id="mod-lista"></div>
    </div>
  </div>
  <div class="footer"><a onclick="sair()">Sair</a></div>
</div>

<script src="js/pwa.js"></script>
<script>
// Nome amigável / seção / descrição são só de APRESENTAÇÃO nesta tela —
// pedido do Alex, 2026-09-18: "só visual por enquanto", sem tabela nova no
// banco. modulos.nome continua "SECOP - Cotações" etc. no banco/admin, pra
// quem já reconhece o codinome nas telas de administração.
const NOME_AMIGAVEL = { secop: 'Cotações', secad: 'Concessionários', pac: 'DFD', detin: 'Gestão de Contratos' };
const SECAO_POR_MODULO = { secop: 'SECOP', secad: 'SECAD', pac: 'PAC' }; // detin: sem seção
const DESCRICAO_MODULO = {
  secop: 'Pesquisa de preços e cotação de fornecedores',
  secad: 'Contratos de concessão e comunicados oficiais',
  pac: 'Documento de Formalização de Demanda — planejamento anual',
  detin: 'Contratos de TI: vigência, aditivos e vencimentos',
};

let _grupos = []; // [{ nome, cor, itens: [modulo,...] }] — 1 por departamento

async function sair() {
  try { await fetch('/api/auth/logout', { method: 'POST' }); } catch {}
  window.location.replace('/login.html');
}

function iniciais(nome) {
  return (nome || '?').trim().charAt(0).toUpperCase();
}

// Contraste automático: cores claras (ex. o âmbar do PAC/DFD, #F9A800) não
// têm contraste suficiente com texto/ícone branco por cima — decide a cor
// de texto/traço com base na luminância em vez de fixar por módulo.
function corContraste(hex) {
  const h = String(hex || '').replace('#', '');
  if (h.length !== 6) return '#fff';
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  const luminancia = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminancia > 0.6 ? '#3D2900' : '#fff';
}

function iconeDepartamento(corIcone) {
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${corIcone}" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`;
}

async function carregar() {
  const grid = document.getElementById('dept-grid');
  const err  = document.getElementById('error-msg');
  try {
    const res = await fetch('/api/auth/modulos');
    if (res.status === 401) { window.location.replace('/login.html'); return; }
    const { modulos } = await res.json();
    if (!modulos || !modulos.length) {
      grid.innerHTML = '';
      err.textContent = 'Você não tem nenhum módulo liberado. Procure o administrador do sistema.';
      err.style.display = 'block';
      return;
    }
    // Agrupa por departamento (ordem de chegada — já vem ordenado por
    // m.ordem do servidor); módulo sem departamento vira um grupo próprio,
    // usando o nome do módulo como "departamento" (não deixa ninguém de fora).
    const porDept = new Map();
    _grupos = [];
    modulos.forEach(m => {
      const chave = m.departamento_slug || `_solto_${m.slug}`;
      let g = porDept.get(chave);
      if (!g) { g = { nome: m.departamento_nome || m.nome, cor: m.cor, itens: [] }; porDept.set(chave, g); _grupos.push(g); }
      g.itens.push(m);
    });
    renderDepartamentos();
  } catch {
    err.textContent = 'Erro ao carregar os módulos.';
    err.style.display = 'block';
  }
}

function renderDepartamentos() {
  const grid = document.getElementById('dept-grid');
  grid.innerHTML = _grupos.map((g, i) => `
    <button class="dept-card" style="--dept-cor:${g.cor}" onclick="abrirDepartamento(${i})">
      <span class="dept-icone">${iconeDepartamento(corContraste(g.cor))}</span>
      <span class="dept-nome">${g.nome}</span>
      <span class="dept-count">${g.itens.length} módulo${g.itens.length > 1 ? 's' : ''}</span>
    </button>
  `).join('');
}

function abrirDepartamento(i) {
  const g = _grupos[i];
  document.getElementById('passo-departamentos').style.display = 'none';
  document.getElementById('passo-modulos').style.display = '';
  document.getElementById('passo2-icone').style.setProperty('--dept-cor', g.cor);
  document.getElementById('passo2-icone').innerHTML = iconeDepartamento(corContraste(g.cor));
  document.getElementById('passo2-nome').textContent = g.nome;

  // Sub-agrupa por Seção só pra exibição (mapa fixo acima) — módulo sem
  // seção mapeada aparece direto na lista, sem título de grupo.
  const porSecao = new Map();
  const semSecao = [];
  g.itens.forEach(m => {
    const secao = SECAO_POR_MODULO[m.slug];
    if (!secao) { semSecao.push(m); return; }
    if (!porSecao.has(secao)) porSecao.set(secao, []);
    porSecao.get(secao).push(m);
  });

  let html = '';
  porSecao.forEach((itens, secao) => {
    html += `<div class="secao-titulo">Seção ${secao}</div>`;
    html += itens.map(itemModuloHtml).join('');
  });
  html += semSecao.map(itemModuloHtml).join('');
  document.getElementById('mod-lista').innerHTML = html;
}

function itemModuloHtml(m) {
  const nome = NOME_AMIGAVEL[m.slug] || m.nome;
  const desc = DESCRICAO_MODULO[m.slug] || '';
  return `
    <button class="mod-item" style="--mod-cor:${m.cor};--mod-texto:${corContraste(m.cor)}" onclick="entrar('${m.slug}')">
      <span class="mod-badge">${iniciais(nome)}</span>
      <span class="mod-info">
        <span class="mod-nome">${nome}</span>
        ${desc ? `<span class="mod-desc">${desc}</span>` : ''}
      </span>
      <svg class="mod-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  `;
}

function voltarParaDepartamentos() {
  document.getElementById('passo-modulos').style.display = 'none';
  document.getElementById('passo-departamentos').style.display = '';
}

async function entrar(slug) {
  const err = document.getElementById('error-msg');
  err.style.display = 'none';
  document.querySelectorAll('.mod-item').forEach(b => b.style.pointerEvents = 'none');
  try {
    const res = await fetch('/api/auth/selecionar-modulo', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug })
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      err.textContent = e.error || 'Erro ao entrar no módulo.';
      err.style.display = 'block';
      document.querySelectorAll('.mod-item').forEach(b => b.style.pointerEvents = '');
      return;
    }
    const { home } = await res.json();
    // Já grava o módulo escolhido no cache local — a próxima página lê isso
    // de forma síncrona (ver snippet no <head>) e nasce com a cor certa, sem
    // esperar o auth.js confirmar de novo via API.
    try { localStorage.setItem('secop_modulo_cache', slug); } catch {}
    window.location.replace(home || '/index.html');
  } catch {
    err.textContent = 'Erro de conexão com o servidor.';
    err.style.display = 'block';
    document.querySelectorAll('.mod-item').forEach(b => b.style.pointerEvents = '');
  }
}

carregar();
</script>
</body>
</html>
