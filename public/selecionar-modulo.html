<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escolha o módulo — CEASA CONECTA</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1A6B35">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('secop_tema')||'light');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #f0f4f1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap { width: 100%; max-width: 460px; padding: 16px; }
    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 22px; font-weight: 700; color: #1A6B35; letter-spacing: .5px; }
    .header p { font-size: 13px; color: #666; margin-top: 4px; letter-spacing: 1.5px; text-transform: uppercase; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
    }
    .card h2 { font-size: 17px; font-weight: 700; color: #1a2035; margin-bottom: 4px; }
    .card > p { font-size: 13px; color: #888; margin-bottom: 20px; }
    .mod-list { display: flex; flex-direction: column; gap: 12px; }
    .dept-titulo {
      font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase;
      letter-spacing: 1px; margin-top: 4px;
    }
    .dept-titulo:first-child { margin-top: 0; }
    .mod-item {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: left;
      padding: 16px 18px;
      border: 1.5px solid #e0e4ea;
      border-left: 5px solid var(--mod-cor, #1A6B35);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: box-shadow .15s, transform .05s, border-color .15s;
    }
    .mod-item:hover { box-shadow: 0 3px 14px rgba(0,0,0,.10); }
    .mod-item:active { transform: translateY(1px); }
    .mod-badge {
      width: 40px; height: 40px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--mod-cor, #1A6B35); color: #fff; font-weight: 700; font-size: 18px;
    }
    .mod-nome { font-size: 15px; font-weight: 600; color: #1a2035; }
    .mod-sub  { font-size: 12px; color: #888; margin-top: 2px; }
    .mod-arrow { margin-left: auto; color: #bbb; flex-shrink: 0; }
    .error-msg {
      display: none;
      background: #FFEBEE; border: 1px solid #EF9A9A; color: #C62828;
      border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px;
    }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; }
    .footer a { color: #888; text-decoration: underline; cursor: pointer; }
    [data-theme="dark"] body { background: #0d1117; }
    [data-theme="dark"] .header h1 { color: #58a6ff; }
    [data-theme="dark"] .header p  { color: #8b949e; }
    [data-theme="dark"] .card { background: #161b22; box-shadow: 0 4px 24px rgba(0,0,0,.4); }
    [data-theme="dark"] .card h2 { color: #e6edf3; }
    [data-theme="dark"] .card > p, [data-theme="dark"] .mod-sub { color: #8b949e; }
    [data-theme="dark"] .dept-titulo { color: #6e7681; }
    [data-theme="dark"] .mod-item { background: #0d1117; border-color: #30363d; }
    [data-theme="dark"] .mod-nome { color: #e6edf3; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>CEASA CONECTA</h1>
    <p>CEASAMINAS</p>
  </div>
  <div class="card">
    <h2>Escolha o módulo</h2>
    <p>Selecione com qual módulo você quer trabalhar.</p>
    <div class="error-msg" id="error-msg"></div>
    <div class="mod-list" id="mod-list">
      <div style="text-align:center;color:#aaa;padding:20px;font-size:13px;">Carregando...</div>
    </div>
  </div>
  <div class="footer"><a onclick="sair()">Sair</a></div>
</div>

<script src="js/pwa.js"></script>
<script>
async function sair() {
  try { await fetch('/api/auth/logout', { method: 'POST' }); } catch {}
  window.location.replace('/login.html');
}

function iniciais(nome) {
  return (nome || '?').trim().charAt(0).toUpperCase();
}

async function carregar() {
  const lista = document.getElementById('mod-list');
  const err   = document.getElementById('error-msg');
  try {
    const res = await fetch('/api/auth/modulos');
    if (res.status === 401) { window.location.replace('/login.html'); return; }
    const { modulos } = await res.json();
    if (!modulos || !modulos.length) {
      lista.innerHTML = '';
      err.textContent = 'Você não tem nenhum módulo liberado. Procure o administrador do sistema.';
      err.style.display = 'block';
      return;
    }
    lista.innerHTML = '';
    // Agrupa por departamento (mantendo a ordem de chegada — já vem ordenado
    // por m.ordem do servidor); módulo sem departamento fica num grupo "solto".
    const grupos = [];
    const porDept = new Map();
    modulos.forEach(m => {
      const chave = m.departamento_slug || '';
      let g = porDept.get(chave);
      if (!g) { g = { nome: m.departamento_nome || '', itens: [] }; porDept.set(chave, g); grupos.push(g); }
      g.itens.push(m);
    });
    grupos.forEach(g => {
      if (g.nome) {
        const titulo = document.createElement('div');
        titulo.className = 'dept-titulo';
        titulo.textContent = g.nome;
        lista.appendChild(titulo);
      }
      g.itens.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'mod-item';
        btn.style.setProperty('--mod-cor', m.cor);
        btn.innerHTML = `
          <span class="mod-badge">${iniciais(m.nome)}</span>
          <span>
            <span class="mod-nome">${m.nome}</span>
          </span>
          <svg class="mod-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>`;
        btn.addEventListener('click', () => entrar(m.slug, btn));
        lista.appendChild(btn);
      });
    });
  } catch {
    err.textContent = 'Erro ao carregar os módulos.';
    err.style.display = 'block';
  }
}

async function entrar(slug, btn) {
  const err = document.getElementById('error-msg');
  err.style.display = 'none';
  document.querySelectorAll('.mod-item').forEach(b => b.style.pointerEvents = 'none');
  try {
    const res = await fetch('/api/auth/selecionar-modulo', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug })
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      err.textContent = e.error || 'Erro ao entrar no módulo.';
      err.style.display = 'block';
      document.querySelectorAll('.mod-item').forEach(b => b.style.pointerEvents = '');
      return;
    }
    const { home } = await res.json();
    window.location.replace(home || '/index.html');
  } catch {
    err.textContent = 'Erro de conexão com o servidor.';
    err.style.display = 'block';
    document.querySelectorAll('.mod-item').forEach(b => b.style.pointerEvents = '');
  }
}

carregar();
</script>
</body>
</html>
