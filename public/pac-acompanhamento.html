<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAC — Acompanhamento — CEASA CONECTA</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F9A800">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('secop_tema')||'light');</script>
  <style>
    /* ── PAC/Acompanhamento (gestor) — mesmos nomes de classe do Acompanhamento
       do DEPLA em pac-gestao.html (CSS duplicada por página, mesmo padrão já
       usado ali pros badges de status do DFD). ──────────────────────────────── */
    .pac-card { background: var(--surface); border: 1px solid var(--cinza-b); border-radius: 10px; padding: 20px 22px; margin-bottom: 18px; }
    .pac-card-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
    .pac-filtros { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
    .pac-filtros .form-group { margin: 0; min-width: 160px; }
    .badge-aberto  { background: #dbeafe; color: #1e40af; }
    .badge-analise { background: #fef9c3; color: #854d0e; }
    .badge-fechado { background: #e5e7eb; color: #4b5563; }
    [data-theme="dark"] .badge-aberto  { background: rgba(37,99,235,.2); color: #93c5fd; }
    [data-theme="dark"] .badge-analise { background: rgba(202,138,4,.22); color: #fde047; }
    [data-theme="dark"] .badge-fechado { background: rgba(100,116,139,.25); color: #cbd5e1; }
    .pac-saldo-neg { color: #c0392b; font-weight: 700; }
    [data-theme="dark"] .pac-saldo-neg { color: #f87171; }
    tr.acomp-sub-row td { background: var(--surface-2); padding: 10px 16px; }
    tr.acomp-sub-row.hidden { display: none; }
    .acomp-toggle { cursor: pointer; -webkit-user-select: none; user-select: none; }
    tfoot td { font-weight: 700; border-top: 2px solid var(--cinza-b); }
  </style>
</head>
<body data-modulo="pac" data-rotina="pac-acompanhamento">
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="img/Ceasa_Signea.png" alt="CEASAMINAS" class="sidebar-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
      <div class="sidebar-logo-fallback" style="display:none;align-items:center;gap:10px;margin-bottom:8px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="32" height="32" style="flex-shrink:0"><polygon points="20,1 1,20 20,20" fill="#1565C0"/><polygon points="20,1 39,20 20,20" fill="#F9A800"/><polygon points="39,20 20,39 20,20" fill="#1565C0"/><polygon points="1,20 20,39 20,20" fill="#1565C0"/></svg>
        <div><div class="logo-title">CEASA CONECTA</div><div class="logo-sub">CEASAMINAS</div></div>
      </div>
      <div class="logo-divider"></div>
    </div>
    <nav>
      <a href="pac-lancamento.html" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Lançamento
      </a>
      <a href="pac-acompanhamento.html" class="nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 4 4 5-5"/></svg>
        Acompanhamento
      </a>
      <a href="pac-gestao.html" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 4 4 5-5"/></svg>
        Gestão
      </a>
    </nav>
    <div class="sidebar-footer">
      <span id="sidebar-username" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px;">—</span>
      <div style="display:flex;gap:2px;flex-shrink:0;">
        <a href="admin.html" class="sidebar-gear" title="Administração">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
        <button onclick="logout()" class="sidebar-gear" title="Sair" style="background:none;border:none;cursor:pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">PAC — Acompanhamento</div>
        <div class="page-subtitle" id="acomp-subtitulo">Carregando...</div>
      </div>
    </div>

    <div class="pac-card">
      <div class="pac-filtros">
        <div class="form-group"><label>DFD (exercício)</label><select id="acomp-dfd-select" onchange="carregarAcompanhamento()"></select></div>
        <div class="form-group" id="acomp-setor-wrap" style="display:none;">
          <label>Setor</label>
          <select id="acomp-setor-select" onchange="carregarAcompanhamento()"></select>
        </div>
        <div class="form-group"><label>Status</label>
          <select id="acomp-filtro-status" onchange="renderTabelaAcompanhamento()">
            <option value="">Todos</option>
            <option>Não Iniciado</option><option>Processado DEPLA</option>
            <option>Fracionamento Aberto</option><option>Processo Finalizado</option><option>Cancelado</option>
          </select>
        </div>
      </div>
    </div>
    <div class="pac-card">
      <div class="table-wrap"><table id="acomp-table">
        <thead><tr>
          <th></th><th>Nº PAC</th><th>Descrição</th><th>Tipo</th>
          <th>Est. TU+MLP</th><th>Est. RDC</th><th>Status</th><th>Solic.</th>
          <th>Real. TU+MLP</th><th>Real. RDC</th><th>Saldo TU+MLP</th><th>Saldo RDC</th>
        </tr></thead>
        <tbody id="acomp-tbody"><tr><td colspan="12" style="padding:20px;text-align:center;color:var(--text-subtle);">Selecione um DFD.</td></tr></tbody>
        <tfoot id="acomp-tfoot"></tfoot>
      </table></div>
    </div>

    <div id="app-footer"></div>
  </main>
</div>

<div id="toast"></div>
<script src="js/pwa.js"></script>
<script src="js/auth.js"></script>
<script src="js/pac-acompanhamento.js"></script>
</body>
</html>
